<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-Nurse | Your Digital Health Assistant</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg,#60c2b8  0%, #17a9bc 50%,#04c4de  100%);
    display: flex;
    flex-direction: column; 
    align-items: center;
    justify-content: center;
    padding: 20px;
  
  }

  .container {
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
    padding: 50px 40px;
    max-width: 500px;
    width: 100%;
    text-align: center;
    
  }


  h1 {
    color: #00695c;
    font-size: xx-large;
    margin-bottom: 10px;
    line-height:1.1;
  }

  p.subtitle {
    color: #555;
    font-size: 15px;
    margin-bottom: 30px;
    line-height: 1.5;
  }

  .form-group {
    text-align: left;
    margin-bottom: 20px;
  }

  label {
    display: block;
    font-size: 16px;
    color: #464545;
    margin-bottom: 8px;
    font-weight: 600;
  }

  input[type="text"] {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid #b2dfdb;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.3s;
  }

  input[type="text"]:focus {
    border-color: #00897b;
  }

  button {
    width: 100%;
    padding: 14px;
    background: #0bc0dc;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.3s, transform 0.2s;
  }

  button:hover {
    background: #00d3f3;
    transform: translateY(-2px);
  }

  footer {
    margin-top: 25px;
    color: #ffffff;
    font-size: 13px;
    opacity: 0.9;
  }
  @media (max-width: 600px) {
  h1 {
    
    font-size: 24px;
  }
  p.subtitle{
    font-size:12px;
  }
}

</style>
</head>
<body>

  <div class="container">
   
        <img src="/heart.png" alt="heart image" width="100px">
    
    <h1>AI-Nurse: Your Digital Health Assistant</h1>
    <p class="subtitle">
      Describe your symptoms and let AI-Nurse guide you with quick, reliable health insights.
    </p>

    <div class="form-group">
      <label for="symptoms">Enter your symptoms</label>
      <input type="text" id="symptoms" placeholder="e.g. fever, headache, cough...">
    </div>

    <button type="button">Check Health</button>
  </div>

  <footer>
    &copy; 2026 AI-Nurse. Built with care, powered by AI.
  </footer>

</body>
</html>
